<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 375 812"
  width="100%"
  height="100%"
  style="background: #F8F9FA; font-family: 'Segoe UI', Arial, sans-serif"
>
  <defs>
    <style>
      @keyframes fadeIn {
        0%   { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0);    }
      }
      .a1 { animation: fadeIn 0.45s ease-out both; animation-delay: 0.00s; }
      .a2 { animation: fadeIn 0.45s ease-out both; animation-delay: 0.15s; }
      .a3 { animation: fadeIn 0.45s ease-out both; animation-delay: 0.30s; }
      .a4 { animation: fadeIn 0.45s ease-out both; animation-delay: 0.45s; }
      .a5 { animation: fadeIn 0.45s ease-out both; animation-delay: 0.60s; }
      .btn-apply { cursor: pointer; transition: transform 0.12s; }
      .btn-apply:active { transform: scale(0.95); }
      .btn-back  { cursor: pointer; transition: opacity 0.15s; }
      .btn-back:active  { opacity: 0.5; }
      .skill-tag { transition: transform 0.15s; }
      .skill-tag:hover { transform: scale(1.06); }
    </style>
  </defs>

  <rect width="375" height="44" fill="#E9ECEF" />
  <text x="345" y="28" fill="#6C757D" font-size="10" text-anchor="end">10:00 AM</text>

  <rect y="44" width="375" height="56" fill="#FFFFFF" stroke="#DEE2E6" />
  <a href="SVG2.svg" target="_top">
    <g class="btn-back" transform="translate(14, 58)">
      <path d="M20 14 L12 22 L20 30" stroke="#495057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="30" y="26" font-size="14" fill="#495057">Back</text>
    </g>
  </a>
  <text x="187" y="78" font-size="16" font-weight="bold" fill="#212529" text-anchor="middle">Project Details</text>

  <g class="a1" transform="translate(16, 120)">
    <text x="0" y="16" font-size="20" font-weight="bold" fill="#212529">Social Media Graphic Designer</text>
    <text x="0" y="38" font-size="13" font-weight="600" fill="#495057">Local Bakery Co. • Gulberg, Lahore</text>
  </g>

  <g class="a2" transform="translate(16, 180)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#E8F0FE" />
    <text x="14" y="19" font-size="12" font-weight="600" fill="#3880FF">📍 Lahore</text>

    <rect x="110" y="0" width="72" height="28" rx="14" fill="#E9ECEF" />
    <text x="122" y="19" font-size="12" font-weight="600" fill="#495057">⏱️ 2 weeks</text>

    <rect x="192" y="0" width="82" height="28" rx="14" fill="#FFF3E0" />
    <text x="204" y="19" font-size="12" font-weight="600" fill="#E65100">⚡ Urgent</text>
  </g>

  <g class="a3" transform="translate(16, 226)">
    <rect x="0" y="0" width="343" height="55" rx="10" fill="#FFFFFF" stroke="#DEE2E6" />
    <text x="16" y="22" font-size="14" font-weight="bold" fill="#212529">PKR 15,000 - 25,000</text>
    <text x="16" y="40" font-size="11" fill="#6C757D">Estimated budget for the project</text>
    <rect x="235" y="12" width="82" height="20" rx="4" fill="#E8F8F0" />
    <text x="241" y="26" font-size="11" font-weight="600" fill="#2B9348">💰 Fixed Price</text>
  </g>

  <g class="a4" transform="translate(16, 300)">
    <text x="0" y="14" font-size="15" font-weight="bold" fill="#212529">Description</text>
    <text x="0" y="36" font-size="13" fill="#495057">We are looking for a creative graphic designer to</text>
    <text x="0" y="54" font-size="13" fill="#495057">create engaging social media visuals for our bakery.</text>
    <text x="0" y="72" font-size="13" fill="#495057">Must have experience with Instagram &amp; Facebook.</text>
  </g>

  <g class="a5" transform="translate(16, 410)">
    <text x="0" y="14" font-size="15" font-weight="bold" fill="#212529">Required Skills</text>

    <g class="skill-tag" transform="translate(0, 28)">
      <rect x="0" y="0" width="80" height="26" rx="6" fill="#F1F3F5" />
      <text x="14" y="17" font-size="12" fill="#495057">Photoshop</text>
    </g>
    <g class="skill-tag" transform="translate(88, 28)">
      <rect x="0" y="0" width="80" height="26" rx="6" fill="#F1F3F5" />
      <text x="14" y="17" font-size="12" fill="#495057">Illustrator</text>
    </g>
    <g class="skill-tag" transform="translate(176, 28)">
      <rect x="0" y="0" width="80" height="26" rx="6" fill="#F1F3F5" />
      <text x="14" y="17" font-size="12" fill="#495057">Canva</text>
    </g>
    <g class="skill-tag" transform="translate(0, 60)">
      <rect x="0" y="0" width="95" height="26" rx="6" fill="#F1F3F5" />
      <text x="14" y="17" font-size="12" fill="#495057">Typography</text>
    </g>
  </g>

  <rect y="748" width="375" height="64" fill="#FFFFFF" stroke="#DEE2E6" />
  <g transform="translate(16, 732)">
    <text x="0" y="14" font-size="11" fill="#6C757D">Posted 2 days ago • 12 applicants</text>
  </g>
  <a href="SVG3.svg" target="_top">
    <g class="btn-apply" transform="translate(47, 756)">
      <rect x="0" y="0" width="280" height="46" rx="23" fill="#2B9348" />
      <text x="140" y="29" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Apply Now →</text>
    </g>
  </a>
</svg>
