<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 375 812"
  width="100%"
  height="100%"
  style="background: linear-gradient(180deg, #ffffff 0%, #F0F4FF 50%, #E8F0FE 100%); font-family: 'Segoe UI', Arial, sans-serif"
>
  <defs>
    <style>
      @keyframes fadeUp {
        0%   { opacity: 0; transform: translateY(30px); }
        100% { opacity: 1; transform: translateY(0);    }
      }
      @keyframes ringPulse {
        0%   { opacity: 0.5; rx: 48; ry: 48; }
        100% { opacity: 0;   rx: 78; ry: 78; }
      }
      .anim { animation: fadeUp 0.7s ease-out both; }
      .d1   { animation-delay: 0.2s; }
      .d2   { animation-delay: 0.5s; }
      .d3   { animation-delay: 0.8s; }
      .pulse-ring { animation: ringPulse 1.8s ease-out infinite; }
      .btn { cursor: pointer; transition: transform 0.12s; }
      .btn:active { transform: scale(0.92); }
    </style>
  </defs>

  <rect width="375" height="44" fill="#E9ECEF" />
  <text x="345" y="28" fill="#6C757D" font-size="10" text-anchor="end">10:00 AM</text>

  <ellipse
    class="pulse-ring"
    cx="187" cy="190" rx="48" ry="48"
    fill="none" stroke="#3880FF" stroke-width="2"
    style="opacity: 0.15"
  />

  <g class="anim d1" transform="translate(187, 190)">
    <rect x="-48" y="-48" width="96" height="96" rx="24" fill="#3880FF" />
    <text x="0" y="12" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">SL</text>
  </g>

  <g class="anim d1">
    <text x="187" y="300" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">SkillLink</text>
    <text x="187" y="328" font-size="14" fill="#6C757D" text-anchor="middle">Find local projects. Build your skills.</text>
  </g>

  <line x1="140" y1="350" x2="235" y2="350" stroke="#DEE2E6" stroke-width="1" />
  <circle cx="187" cy="350" r="3" fill="#3880FF" />

  <g class="anim d2">
    <g transform="translate(60, 380)">
      <rect x="0" y="0" width="255" height="40" rx="8" fill="#ffffff" stroke="#DEE2E6" />
      <circle cx="22" cy="20" r="10" fill="#E8F0FE" />
      <text x="22" y="24" font-size="11" fill="#3880FF" text-anchor="middle">✓</text>
      <text x="42" y="24" font-size="13" fill="#495057">Discover projects near you</text>
    </g>
    <g transform="translate(60, 430)">
      <rect x="0" y="0" width="255" height="40" rx="8" fill="#ffffff" stroke="#DEE2E6" />
      <circle cx="22" cy="20" r="10" fill="#E8F0FE" />
      <text x="22" y="24" font-size="11" fill="#3880FF" text-anchor="middle">✓</text>
      <text x="42" y="24" font-size="13" fill="#495057">Connect with local businesses</text>
    </g>
    <g transform="translate(60, 480)">
      <rect x="0" y="0" width="255" height="40" rx="8" fill="#ffffff" stroke="#DEE2E6" />
      <circle cx="22" cy="20" r="10" fill="#E8F0FE" />
      <text x="22" y="24" font-size="11" fill="#3880FF" text-anchor="middle">✓</text>
      <text x="42" y="24" font-size="13" fill="#495057">Showcase your skills &amp; grow</text>
    </g>
  </g>

  <g class="anim d3">
    <a href="SVG2.svg" target="_top">
      <g class="btn" transform="translate(47, 570)">
        <rect x="0" y="0" width="280" height="50" rx="25" fill="#3880FF" />
        <text x="140" y="31" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Get Started →</text>
      </g>
    </a>
  </g>

  <g class="anim d3" transform="translate(187, 650)">
    <text x="0" y="14" font-size="12" fill="#ADB5BD" text-anchor="middle">Already have an account?</text>
    <text x="0" y="32" font-size="12" font-weight="600" fill="#3880FF" text-anchor="middle">Sign In</text>
  </g>
</svg>
