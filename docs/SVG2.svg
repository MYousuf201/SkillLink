<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 375 812"
  width="100%"
  height="100%"
  style="background: #F8F9FA; font-family: 'Segoe UI', Arial, sans-serif"
>
  <defs>
    <style>
      @keyframes blink { 50% { opacity: 0; } }

      .search-group:hover .search-bg,
      .search-group:focus-within .search-bg {
        stroke: #3880FF;
        stroke-width: 2.5;
        filter: drop-shadow(0 0 6px rgba(56, 128, 255, 0.3));
      }

      .search-group:hover .search-placeholder,
      .search-group:focus-within .search-placeholder {
        opacity: 0;
      }

      .search-group:hover .search-cursor,
      .search-group:focus-within .search-cursor {
        opacity: 1;
        animation: blink 1s step-end infinite;
      }

      .search-cursor { opacity: 0; }
      .card { cursor: pointer; transition: transform 0.12s; }
      .card:active { transform: scale(0.98); }
      .btn-card { cursor: pointer; transition: background 0.12s; }
      .btn-card:active rect { fill: #E9ECEF; }
    </style>
  </defs>

  <rect width="375" height="44" fill="#E9ECEF" />
  <text x="345" y="28" fill="#6C757D" font-size="10" text-anchor="end">10:00 AM</text>

  <rect y="44" width="375" height="56" fill="#FFFFFF" stroke="#DEE2E6" />
  <text x="16" y="78" font-size="20" font-weight="bold" fill="#212529">SkillLink</text>
  <circle cx="339" cy="72" r="16" fill="#E9ECEF" stroke="#CED4DA" />
  <path d="M333 80 C333 74, 345 74, 345 80" stroke="#6C757D" fill="none" stroke-width="2" />
  <circle cx="339" cy="68" r="5" fill="#6C757D" />

  <g class="search-group" tabindex="0">
    <rect
      class="search-bg"
      x="16" y="116" width="343" height="44" rx="8"
      fill="#FFFFFF" stroke="#CED4DA" stroke-width="1.5"
      style="transition: stroke 0.25s"
    />
    <circle cx="30" cy="138" r="5" stroke="#6C757D" stroke-width="2" fill="none" />
    <line x1="34" y1="142" x2="39" y2="147" stroke="#6C757D" stroke-width="2" stroke-linecap="round" />
    <text
      class="search-placeholder"
      x="44" y="142" font-size="14" fill="#ADB5BD"
      style="transition: opacity 0.2s"
    >Search local projects (e.g., Graphic Design)...</text>
    <rect class="search-cursor" x="44" y="131" width="1.5" height="14" fill="#3880FF" rx="1" style="transition: opacity 0.2s" />
  </g>

  <rect x="16" y="172" width="105" height="28" rx="14" fill="#E8F0FE" stroke="#3880FF" />
  <text x="28" y="190" font-size="12" font-weight="600" fill="#3880FF">📍 Lahore</text>
  <text x="104" y="190" font-size="12" font-weight="bold" fill="#3880FF">×</text>

  <rect x="127" y="172" width="90" height="28" rx="14" fill="#FFFFFF" stroke="#CED4DA" />
  <text x="139" y="190" font-size="12" fill="#495057">💰 PKR</text>

  <rect x="223" y="172" width="85" height="28" rx="14" fill="#FFFFFF" stroke="#CED4DA" />
  <text x="235" y="190" font-size="12" fill="#495057">⚡ Design</text>

  <text x="16" y="224" font-size="12" font-weight="600" fill="#6C757D">Showing 24 local projects near you</text>

  <a href="SVG4.svg" target="_top">
    <g class="card" transform="translate(16, 240)">
      <rect width="343" height="154" rx="12" fill="#FFFFFF" stroke="#DEE2E6" />
      <text x="16" y="28" font-size="16" font-weight="bold" fill="#212529">Social Media Graphic Designer</text>
      <text x="16" y="48" font-size="13" font-weight="600" fill="#495057">Local Bakery Co. • Gulberg, Lahore</text>
      <text x="16" y="74" font-size="14" font-weight="bold" fill="#2B9348">PKR 15,000 - 25,000</text>
      <rect x="165" y="62" width="75" height="18" rx="4" fill="#E9ECEF" />
      <text x="171" y="75" font-size="11" fill="#495057">⏱️ 2 weeks</text>
      <rect x="16" y="92" width="68" height="20" rx="4" fill="#F1F3F5" />
      <text x="22" y="106" font-size="11" fill="#6C757D">Photoshop</text>
      <rect x="90" y="92" width="68" height="20" rx="4" fill="#F1F3F5" />
      <text x="96" y="106" font-size="11" fill="#6C757D">Illustrator</text>
      <g class="btn-card">
        <rect x="16" y="122" width="311" height="24" rx="6" fill="#F8F9FA" stroke="#CED4DA" />
        <text x="171" y="138" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">View Project Details</text>
      </g>
    </g>
  </a>

  <a href="SVG4.svg" target="_top">
    <g class="card" transform="translate(16, 410)">
      <rect width="343" height="154" rx="12" fill="#FFFFFF" stroke="#DEE2E6" />
      <text x="16" y="28" font-size="16" font-weight="bold" fill="#212529">Brand Identity Kit &amp; Logo</text>
      <text x="16" y="48" font-size="13" font-weight="600" fill="#495057">Tech Startup Edge • DHA, Lahore</text>
      <text x="16" y="74" font-size="14" font-weight="bold" fill="#2B9348">PKR 40,000</text>
      <rect x="110" y="62" width="75" height="18" rx="4" fill="#E9ECEF" />
      <text x="116" y="75" font-size="11" fill="#495057">⏱️ 1 month</text>
      <rect x="16" y="92" width="85" height="20" rx="4" fill="#F1F3F5" />
      <text x="22" y="106" font-size="11" fill="#6C757D">Branding Kit</text>
      <g class="btn-card">
        <rect x="16" y="122" width="311" height="24" rx="6" fill="#F8F9FA" stroke="#CED4DA" />
        <text x="171" y="138" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">View Project Details</text>
      </g>
    </g>
  </a>

  <rect y="748" width="375" height="64" fill="#FFFFFF" stroke="#DEE2E6" />
  <g transform="translate(52, 756)">
    <circle cx="20" cy="18" r="8" stroke="#3880FF" stroke-width="2" fill="none" />
    <line x1="26" y1="24" x2="32" y2="30" stroke="#3880FF" stroke-width="2" />
    <text x="20" y="46" font-size="11" font-weight="bold" fill="#3880FF" text-anchor="middle">Explore</text>
  </g>
  <g transform="translate(167, 756)">
    <rect x="10" y="8" width="20" height="18" rx="2" stroke="#6C757D" stroke-width="2" fill="none" />
    <line x1="14" y1="14" x2="26" y2="14" stroke="#6C757D" stroke-width="2" />
    <line x1="14" y1="19" x2="22" y2="19" stroke="#6C757D" stroke-width="2" />
    <text x="20" y="46" font-size="11" fill="#6C757D" text-anchor="middle">My Jobs</text>
  </g>
  <g transform="translate(282, 756)">
    <circle cx="20" cy="16" r="7" stroke="#6C757D" stroke-width="2" fill="none" />
    <path d="M8 30 C8 24, 32 24, 32 30" stroke="#6C757D" stroke-width="2" fill="none" />
    <text x="20" y="46" font-size="11" fill="#6C757D" text-anchor="middle">Profile</text>
  </g>
</svg>
